services:
  - type: web
    name: uvci-heures
    runtime: docker
    repo: https://github.com/Mrkakuzu75/uvci-heures
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://uvci-heures.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: sql.freedb.tech
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: freedb_uvci_heures
      - key: DB_USERNAME
        value: freedb_uvci_user
      - key: DB_PASSWORD
        value: ton_mot_de_passe
      - key: SESSION_DRIVER
        value: database
